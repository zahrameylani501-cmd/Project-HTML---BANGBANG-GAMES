<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BangBang - Login</title>
    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <!-- ICON -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="auth">
    <!-- START = AUTH -->
    <div class="auth-page">
        <div class="auth-card">
            <span class="material-symbols-outlined" id="close-login">close_small</span>
            <div class="auth-logo">
                <span class="material-symbols-outlined">sword_rose</span>
                <span>BangBang</span>
            </div>
            <h1 class="auth-title">Login</h1>
            <p class="auth-subtitle">Masuk buat mulai jelajahin game gratis</p>
            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>
                <p id="login-error" class="auth-error"></p>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        </div>
    </div>
    <!-- END = AUTH -->
    <!-- JAVA SCRIPT -->
    <script src="js/auth.js"></script>
    <!-- JAVA SCRIPT -->
</body>

</html>
